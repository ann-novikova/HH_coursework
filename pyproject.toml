[tool.poetry]
name = "hh-coursework"
version = "0.1.0"
description = ""
authors = ["Anna Novikova <anna.novikova.dev@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32.4"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"
mypy = "^1.16.1"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
/\.git
'''

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
exclude = 'venv'

[tool.isort]
line_length = 119